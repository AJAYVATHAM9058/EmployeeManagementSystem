<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Management System</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">

</head>
<body>

	<div class="container my-2"> 
	
		<h1>Employee Management System</h1>
		<br>
		<h2>Save Employee</h2>
	
		<form action="#" th:action="@{saveEmployee}"  th:object="${employee}" method="post">
		
			<h3>FirstName</h3>
			<input type="text" th:field="*{firstName}" placeholder="Employee First Name" class="form-control">
			<br>
			<h3>LastName</h3>
			<input type="text" th:field="*{lastName}" placeholder="Employee Last Name" class="form-control">
			<br>
			<h3>Email</h3>
			<input type="email" th:field="*{email}" placeholder="Employee Email" class="form-control">
		
		<br>
			<button type="submit" class="btn btn-info">Save Employee</button>
		<br><br>
		<a th:href="@{/home}">Back To Employee List</a>
		
		</form>
	
	</div>

</body>
</html>
